# REAGENT configuration. Every network destination is listed here by hand.

[agent]
command = "claude"
args = ["-p", "--output-format", "json"]
response_field = "result"
cost_field = "total_cost_usd"
timeout_s = 600

[budget]
max_usd_per_day = 2.00
max_usd_per_extraction = 0.40

[rpc]
# solana = "https://…"      # optional: public endpoints are used when unset
# ethereum = "https://…"
# arbitrum = "https://…"

[sources]
allowed_domains = ["docs.robinhood.com", "robinhood.com"]

[corpus]
max_doc_mb = 40
# OCR is not built in. With ocr = true, assayer doctor says so plainly; a
# document with no text layer is still fetched and hashed, but no evidence is
# accepted from it.
ocr = false

[extract]
# How many characters of each document are handed to the model. Truncation is
# recorded in extraction.json and printed in the dossier, never hidden.
max_chars_per_doc = 120000
# The second mandate: how this can end for the holder. Every thesis must carry a
# verbatim quote, or the gate cuts it before it reaches the document.
challenge = false

[gate]
taint_threshold = 3
halt_on_injection = true

[gate.injection_patterns]
# Text addressed at the agent rather than at the reader. The detector is code,
# this list is configuration, and it stays multilingual on purpose: an issuer
# document can be written in any language.
en = [
  "ignore previous",
  "ignore all previous",
  "disregard the above",
  "disregard previous",
  "system:",
  "assistant:",
  "you are an ai",
  "you are an assistant",
  "new instructions",
  "the report must",
  "do not mention",
  "override the",
  "as an ai language model",
]
other = [
  "ignorez les instructions",
  "vorherige anweisungen ignorieren",
  "忽略以上",
  "以前の指示を無視",
]

[language]
# Blocking vocabulary. A hit fails the run; it is never silently rewritten.
# Verbatim quotes are exempt, so a prospectus may contain any of these words.
# Kept multilingual for the same reason as the patterns above.
#
# "hold" is deliberately absent: this domain is full of holders and holdings,
# and a bare verb cannot be told apart from the buy/sell/hold sense mechanically.
forbidden = [
  "safe", "unsafe", "risky", "riskless", "buy", "sell",
  "scam", "legit", "legitimate", "trustworthy", "reliable",
  "audited", "verified safe", "guaranteed", "risk score",
  "investment advice", "recommend", "recommendation",
]
